<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kh International — үйлдвэр</title>
<style>
:root{--acc:#e0650f;--ink:#141a20;--mute:#5c6773;--line:#dfe3e8;--bg:#f4f6f8;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#141a20;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}header b{font-size:16px}header span{opacity:.7;font-size:12px}
nav{display:flex;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:48px;z-index:4}nav button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-weight:600}nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px}.m{color:var(--mute);font-size:13px}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:10px 0 4px}
select,input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:700;margin-top:12px}.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}
.st{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}.st:first-of-type{border-top:0}.st .n{flex:1}.st .p{font-weight:700;min-width:44px;text-align:right}
.bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc)}
input[type=range]{padding:0;height:36px}
.it{padding:10px 0;border-top:1px solid var(--line)}.it:first-child{border-top:0}.it .q{font-size:14px;margin-bottom:6px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-weight:600}.seg button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.seg button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
#toast{position:fixed;left:12px;right:12px;bottom:14px;background:#141a20;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:9}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;margin:6px 6px 0 0}
</style></head><body>
<header><b id="co">Kh International</b><span id="dt"></span></header>
<nav><button data-v="jobs" class="on">Ажлын явц</button><button data-v="insp">Үзлэг</button></nav>
<main id="main"><p class="m">Ачаалж байна…</p></main>
<div id="toast"></div>
<script>
const T = new URLSearchParams(location.search).get('t') || '', $ = s => document.querySelector(s);
let D = null, V = 'jobs', who = localStorage.getItem('kh-who') || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const toast = (m, ms = 2600) => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', ms); };
const api = async (p, body) => { const r = await fetch(p + '?t=' + encodeURIComponent(T), body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {}); const j = await r.json(); if (!r.ok || j.error) throw new Error(j.error || r.status); return j; };
async function load() { try { D = await api('/api/state'); $('#co').textContent = D.company || 'Kh International'; $('#dt').textContent = D.date; render(); } catch (e) { $('#main').innerHTML = `<div class="card"><h3>Холбогдсонгүй</h3><p class="m">${esc(e.message)}</p><p class="m">Компьютер асаалттай, програм нээлттэй, утас ижил Wi-Fi-д байгаа эсэхийг шалгаад QR-ыг дахин уншуулна уу.</p><button class="btn g" onclick="load()">Дахин оролдох</button></div>`; } }
const whoSel = id => `<label>Таны нэр</label><input id="${id}" list="ppl" value="${esc(who)}" placeholder="Нэрээ сонгох эсвэл бичих" autocomplete="off"><datalist id="ppl">${D.people.map(p => `<option value="${esc(p)}">`).join('')}</datalist>`;
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === V));
  if (V === 'jobs') {
    $('#main').innerHTML = D.jobs.length ? D.jobs.map(j => { const p = j.stages.length ? Math.round(j.stages.reduce((a, s) => a + s.pct, 0) / j.stages.length) : 0; return `<div class="card" data-j="${j.id}"><h3>${esc(j.no)} · ${esc(j.title)}</h3><div class="m">${esc(j.customer)}${j.due ? ' · хугацаа ' + esc(j.due) : ''} · ${esc(j.status)}</div><div class="bar"><i style="width:${p}%"></i></div><div class="m" style="margin-top:4px">Нийт ${p}% — дарж нээнэ</div></div>`; }).join('') : '<div class="card"><p class="m">Идэвхтэй ажил алга.</p></div>';
    document.querySelectorAll('[data-j]').forEach(c => c.onclick = () => job(c.dataset.j));
  } else {
    $('#main').innerHTML = `<div class="card"><h3>Өдөр тутмын үзлэг</h3><label>Тоног төхөөрөмж</label><select id="im"><option value="">— сонгох —</option>${D.machines.map(m => `<option value="${m.id}">${esc(m.no)} · ${esc(m.name)}</option>`).join('')}</select></div><div id="ib"></div>`;
    $('#im').onchange = e => insp(e.target.value);
  }
}
function job(id) {
  const j = D.jobs.find(x => x.id === id); if (!j) return;
  $('#main').innerHTML = `<button class="btn g" id="bk" style="margin-top:0">← Бүх ажил</button><div class="card"><h3>${esc(j.no)} · ${esc(j.title)}</h3><div class="m">${esc(j.customer)}</div>${whoSel('who')}</div>
    <div class="card"><h3>Үе шат — явц</h3>${j.stages.map(s => `<div class="st"><div class="n">${esc(s.name)}<div class="bar"><i style="width:${s.pct}%"></i></div></div><div class="p">${s.pct}%</div></div>`).join('') || '<p class="m">Үе шат алга</p>'}
      <label>Үе шат</label><select id="sg">${j.stages.map(s => `<option value="${s.i}">${esc(s.name)} (${s.pct}%)</option>`).join('')}</select>
      <label>Гүйцэтгэл: <b id="pv"></b></label><input type="range" id="pc" min="0" max="100" step="5">
      <label>Тэмдэглэл (заавал биш)</label><input id="nt" placeholder="жишээ: гагнуур дууссан, будаг хүлээж байна">
      <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="nd" style="width:auto"> Энэ нь «одоо хэрэгтэй / саад» гэж тэмдэглэх</label>
      <button class="btn" id="sv">Хадгалах</button></div>
    <div class="card"><h3>Зураг нэмэх</h3><input type="file" id="ph" accept="image/*" capture="environment" multiple><input id="pn" placeholder="Зургийн тайлбар" style="margin-top:8px"><button class="btn" id="up">Зураг илгээх</button><div class="thumbs" id="th"></div></div>`;
  $('#bk').onclick = () => { V = 'jobs'; load(); };
  const sg = $('#sg'), pc = $('#pc'), set = () => { const s = j.stages.find(x => x.i === +sg.value); pc.value = s ? s.pct : 0; $('#pv').textContent = pc.value + '%'; };
  if (sg) { sg.onchange = set; set(); } pc.oninput = () => $('#pv').textContent = pc.value + '%';
  $('#who').onchange = $('#who').oninput = e => { who = e.target.value; localStorage.setItem('kh-who', who); };
  $('#sv').onclick = async () => { if (!$('#who').value.trim()) return toast('Нэрээ сонгоно уу'); try { const r = await api('/api/progress', { job: j.id, stage: +sg.value, pct: +pc.value, note: $('#nt').value.trim(), needs: $('#nd').checked, who: $('#who').value }); const s = j.stages.find(x => x.i === +sg.value); s.pct = r.pct; toast('✓ Хадгалагдлаа'); job(id); } catch (e) { toast('Алдаа: ' + e.message, 5000); } };
  $('#up').onclick = async () => { const F = [...$('#ph').files]; if (!F.length) return toast('Зураг сонгоно уу'); if (!$('#who').value) return toast('Нэрээ сонгоно уу'); let n = 0;
    for (const f of F) { const url = await shrink(f); try { await api('/api/photo', { job: j.id, name: f.name || 'photo.jpg', data: url, note: $('#pn').value.trim(), who: $('#who').value }); n++; const im = new Image(); im.src = url; $('#th').appendChild(im); } catch (e) { toast('Алдаа: ' + e.message, 5000); } }
    if (n) toast(`✓ ${n} зураг илгээгдлээ`); $('#ph').value = ''; };
}
function shrink(f, max = 1600) { return new Promise(res => { const u = URL.createObjectURL(f), im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.82)); }; im.src = u; }); }
function insp(mid) {
  const m = D.machines.find(x => x.id === mid), box = $('#ib'); if (!m) { box.innerHTML = ''; return; }
  const res = m.items.map(() => ''), notes = m.items.map(() => '');
  box.innerHTML = `<div class="card">${whoSel('iw')}<label>Хянасан ахлах</label><input id="ic" list="ppl" placeholder="заавал биш" autocomplete="off"></div>
    <div class="card"><h3>${esc(m.name)}</h3><button class="btn g" id="allok" style="margin-top:6px">Бүгд хэвийн</button>${m.items.map((t, i) => `<div class="it"><div class="q">${i + 1}. ${esc(t)}</div><div class="seg" data-i="${i}"><button data-v="ok">Хэвийн</button><button data-v="bad">Гэмтэлтэй</button></div><input data-n="${i}" placeholder="Тэмдэглэл" style="margin-top:6px;display:none"></div>`).join('')}</div>
    <div class="card"><label>Дүгнэлт</label><select id="cc"><option value="">— автоматаар —</option>${D.concl.map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join('')}</select><label>Нэмэлт тэмдэглэл</label><input id="in"><button class="btn" id="is">Үзлэг хадгалах</button></div>`;
  const paint = i => { const s = box.querySelector(`.seg[data-i="${i}"]`); s.querySelectorAll('button').forEach(b => b.className = res[i] === b.dataset.v ? b.dataset.v : ''); box.querySelector(`[data-n="${i}"]`).style.display = res[i] === 'bad' ? 'block' : 'none'; };
  box.querySelectorAll('.seg').forEach(s => s.onclick = e => { const b = e.target.closest('button'); if (!b) return; res[+s.dataset.i] = b.dataset.v; paint(+s.dataset.i); });
  box.querySelectorAll('[data-n]').forEach(n => n.oninput = () => notes[+n.dataset.n] = n.value);
  $('#allok').onclick = () => { m.items.forEach((_, i) => { if (res[i] !== 'bad') { res[i] = 'ok'; paint(i); } }); };
  $('#iw').onchange = $('#iw').oninput = e => { who = e.target.value; localStorage.setItem('kh-who', who); };
  $('#is').onclick = async () => { if (!$('#iw').value) return toast('Үзлэг хийсэн хүний нэрийг сонгоно уу'); const miss = res.filter(v => !v).length; if (miss && !confirm(`${miss} мөр бөглөгдөөгүй. Хадгалах уу?`)) return;
    try { const r = await api('/api/insp', { mid: m.id, res, notes, by: $('#iw').value, chk: $('#ic').value, concl: $('#cc').value, note: $('#in').value.trim() }); toast(r.bad ? `✓ Хадгалагдлаа — ${r.bad} гэмтэл бүртгэгдлээ` : '✓ Үзлэг хадгалагдлаа'); $('#im').value = ''; box.innerHTML = ''; } catch (e) { toast('Алдаа: ' + e.message, 5000); } };
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { V = b.dataset.v; if (D) render(); });
load();
</script></body></html>
